<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Movie Finder</title>

    <link rel="stylesheet" href="css/style.css"/>
    <script src="js/script.js" defer></script>

</head>
<body>
    <header class="header">
        <h1>Movie Finder</h1>
        <p>A place to search for movies in The Movie Database API</p>
        <p>Student ID: 200573753 - Student Name: Fahriye Tuncay</p>
    </header>
    <main>
        <section class="search-bar">
            <form id="search-form">
                <input type="text" id="search-input" placeholder="Type in a movie title..."/>
                <button type="submit">Search</button>
            </form>
        </section>

        <section id="results-grid" class="results-grid"></section>

        <div id="movie-modal" class="modal-layout">
            <div class="modal-box">
                <button id="modal-close" class="modal-close"></button>
                <div id="modal-content"></div>
            </div>  
        </div>

    </main>
    









</body>
